name: Something isn't working
description: Tell us what went wrong. No technical knowledge needed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Unbadge is an unofficial community project; please don't contact JioHotstar or LG about it. Check the [troubleshooting guide](https://github.com/pixelhush/unbadge-webos/blob/main/docs/TROUBLESHOOTING.md) first.
  - type: input
    id: model
    attributes:
      label: TV model
      description: "On the TV: Settings → Support → TV Information. Example: OLED65G46LA"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: webOS version and software version
      description: "Same screen as above. Example: webOS 26, 43.21.73"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What's the problem?
      options:
        - I can't install it
        - The Asli 4K badge is showing again
        - Videos don't play
        - The app disappeared
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: What did you do, and what did you see? A photo of the TV screen helps a lot.
    validations:
      required: true
  - type: dropdown
    id: official
    attributes:
      label: Does the official JioHotstar app work normally?
      options:
        - "Yes"
        - "No"
        - I don't know
