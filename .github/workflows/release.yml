name: Release

# Push a tag like v1.0.1 (matching src/appinfo.json) to build the .ipk and
# publish it as a GitHub Release with a SHA-256 checksum.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check
        run: node scripts/check.mjs --tag "$GITHUB_REF_NAME"

      - name: Build
        run: node scripts/build-ipk.mjs

      - name: Checksum
        run: cd dist && sha256sum *.ipk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipk dist/SHA256SUMS.txt --title "Unbadge $GITHUB_REF_NAME" --generate-notes --verify-tag
